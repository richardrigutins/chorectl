name: CI

on:
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  commitlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore
      - run: dotnet tool restore
      - run: dotnet format --verify-no-changes
      - run: dotnet build --no-restore
      - run: dotnet test --no-build --collect:"XPlat Code Coverage" --results-directory ./coverage
      - run: dotnet reportgenerator -reports:./coverage/**/coverage.cobertura.xml -targetdir:./coverage/report -reporttypes:"Html;TextSummary;MarkdownSummaryGithub"
        if: always()
      - run: cat ./coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
        if: always()
      # Non-critical: don't fail the pipeline if the upload fails
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: coverage-report
          path: ./coverage/report
